name: Make repository public after embargo

# Becomes public on/after 8 November 2026 (UTC).
on:
  schedule:
    # 00:05 UTC on 8 November every year
    - cron: "5 0 8 11 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Guard date (UTC)
        id: guard
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only auto-run on/after the embargo end date
          if [ "$TODAY" \< "2026-11-08" ]; then
            echo "Embargo active until 2026-11-08. Skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set repository visibility to public
        if: steps.guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.REPO_VISIBILITY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing secret REPO_VISIBILITY_TOKEN. Add a PAT with repo admin, then re-run."
            exit 1
          fi
          gh api -X PATCH "repos/${{ github.repository }}" \
            -f private=false \
            -f visibility=public
          echo "Repository is now public."
